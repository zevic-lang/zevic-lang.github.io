---
layout: default
---
<div class="wrap prose-wrap">
  <article class="prose">
    <p class="muted"><a href="/blog/">← ブログ</a></p>
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time></p>
    {{ content }}
  </article>
</div>
