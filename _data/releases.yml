  changes:
  - FizzBuzz・階乗・素数が動き、オーバーフロー検査、<code>Panic</code>、<code>Printf</code> が入りました
  release: false
  summary_en: Numbers, control flow and functions.
  changes_en:
  - FizzBuzz, factorial and primes run; overflow checks, <code>Panic</code> and <code>Printf</code> arrive
