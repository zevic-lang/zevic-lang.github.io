- version: 0.4.6
  date: 2026-11-19
  summary: エラーメッセージの改善（名前の候補、null、return 抜けの位置）。examples を個別のパッケージに。
  changes:
  - 未定義の名前・関数・モジュールメンバーのエラーに、近い名前の候補（<code>note: did you mean `Println`?</code>）を添えます
  - <code>null</code> は「Zevic に null は無い」と説明し、<code>Option</code> を案内します。数値・<code>Bool</code>・<code>Char</code> を <code>String</code> として渡したときは文字列補間を提案します
  - 値で終わらない関数のエラーを、開き <code>{</code> ではなく閉じ <code>}</code> の位置に出します
  - 閉じていない文字列のあとは、その字句エラーだけを報告します（続くパースエラーは出しません）
  - <code>examples/</code> の例を、それぞれ <code>zevic.toml</code> と <code>src/Main.zev</code> を持つ個別のパッケージにしました。ディレクトリで <code>zevpm run</code> を実行できます
  release: true
  summary_en: Better error messages (name suggestions, null, the location of a missing return). Every example is now its own package.
  changes_en:
  - Errors about an unknown name, function or module member add the closest name (<code>note: did you mean `Println`?</code>)
  - <code>null</code> explains that Zevic has no null and points to <code>Option</code>. Passing a number, <code>Bool</code> or <code>Char</code> where a <code>String</code> is expected suggests string interpolation
  - A function that does not end with a value is reported at its closing <code>}</code> instead of the opening <code>{</code>
  - After an unterminated string only that lexical error is reported, not the parse errors that follow from it
  - Every example under <code>examples/</code> is now a package of its own, with <code>zevic.toml</code> and <code>src/Main.zev</code>. Run one with <code>zevpm run</code> in its directory
- version: 0.4.5
  date: 2026-11-16
  summary: Termux など書き込み可能な /tmp が無い環境に対応。ビルド成果物の名前を整理。
  changes:
  - Termux など書き込み可能な <code>/tmp</code> が無い環境で、プロセスの出力を <code>$TMPDIR</code>（無ければ <code>/tmp</code>）に書くようにしました。以前はそこで外部プロセス呼び出しがすべて失敗し、clang が見つからないと報告されていました
  - ローカルビルドの <code>make</code> は <code>build/zevpm</code> を作ります。内部用のシードコンパイラは <code>build/bootstrap/zevic</code> に移りました
  release: true
  summary_en: Works where there is no writable /tmp, such as Termux. Build output names tidied up.
  changes_en:
  - On systems without a writable <code>/tmp</code> (Termux and others) the compiler now writes process output under <code>$TMPDIR</code>, falling back to <code>/tmp</code>. Before, every process call failed there and clang was reported as not found
  - 'Local builds: <code>make</code> produces <code>build/zevpm</code>. The internal seed compiler moved to <code>build/bootstrap/zevic</code>'
- version: 0.4.4
  date: 2026-11-16
  summary: Windows のスレッドと GC の修正、既定の最適化を -O0 に。
  changes:
  - 'Windows: <code>Thread.Spawn</code>（と <code>Async.Spawn</code>）で起動したスレッドが Boehm GC に登録され、安全にメモリ確保・回収できます'
  - <code>zevic</code> と <code>zevpm</code> は既定で <code>-O0</code> でビルドします（開発中の高速ビルド）。<code>zevpm build --release</code> は <code>-O2</code>、<code>zevic -O2</code> で明示的に有効にできます
  release: true
  summary_en: Windows threads and the GC; the default optimisation level is now -O0.
  changes_en:
  - 'Windows: threads started by <code>Thread.Spawn</code> (and <code>Async.Spawn</code>) register with the Boehm GC, so they can allocate and be collected safely'
  - <code>zevic</code> and <code>zevpm</code> build with <code>-O0</code> by default (fast builds for development). <code>zevpm build --release</code> keeps <code>-O2</code>; <code>zevic -O2</code> opts in explicitly
- version: 0.4.3
  date: 2026-11-16
  summary: Comparable / Equatable を実装した型で比較演算子が使えるように。
  changes:
  - <code>Comparable</code> を実装した struct / class で <code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code> が使え、<code>Compare</code> メソッドを呼びます
  - <code>Equatable</code> を実装した struct の <code>==</code> は <code>Equals</code> を呼びます（以前はフィールドを比較していました）
  - <code>Async.Spawn</code> はデタッチされた <code>Thread.Thread</code> でタスクを開始します
  release: true
  summary_en: Comparison operators on types that implement Comparable / Equatable.
  changes_en:
  - '<code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code> and <code>&gt;=</code> work on a struct or class that implements <code>Comparable</code>: they call its <code>Compare</code> method'
  - <code>==</code> on a struct that implements <code>Equatable</code> calls its <code>Equals</code> method (it used to compare the fields)
  - <code>Async.Spawn</code> now starts its task on a detached <code>Thread.Thread</code>
- version: 0.4.2
  date: 2026-11-15
  summary: スレッドと多倍長整数、仕様書を実装に合わせて更新。
  changes:
  - '<code>Zevic.Thread</code>: OS スレッド。<code>Thread.Spawn(f)</code> で起動し、<code>Join()</code> で待ちます'
  - '<code>Zevic.BigInt</code>: 任意精度の整数。四則演算、<code>Pow</code>、<code>Parse</code>、<code>ToString</code> など'
  - 言語仕様書を実装に合わせて更新しました
  release: true
  summary_en: Threads and arbitrary-precision integers; the specification brought up to date.
  changes_en:
  - '<code>Zevic.Thread</code>: OS threads. <code>Thread.Spawn(f)</code> starts a function on a new thread; <code>Join()</code> waits for it'
  - '<code>Zevic.BigInt</code>: integers of any size. Arithmetic, <code>Pow</code>, <code>Parse</code>, <code>ToString</code> and more'
  - The language specification now matches the implementation
- version: 0.4.1
  date: 2026-11-12
  summary: 標準ライブラリの大幅な拡充と、他言語との連携例。
  changes:
  - <code>Text.Format</code>、<code>StringBuilder</code>、<code>Iterable</code> / <code>Array</code> / <code>Map</code> / <code>Set</code> の多数のメソッド
  - '新モジュール: <code>Regex</code> <code>Csv</code> <code>Toml</code> <code>DateTime</code> <code>Log</code> <code>Cli</code> <code>Net</code> <code>Zip</code> <code>Tar</code> <code>Gzip</code> <code>Digest</code> <code>Encoding</code> ほか'
  - C 実装（zevic0）は <a href="https://github.com/zevic-lang/zevic-c">zevic-lang/zevic-c</a> に分離しました。リポジトリは clang だけでビルドできます
  - C++ / Rust / Go / Python から Zevic ライブラリを呼ぶ例と、Zevic から Rust / C++ を呼ぶ例
  release: true
  summary_en: A much larger standard library, and examples for other languages.
  changes_en:
  - <code>Text.Format</code>, <code>StringBuilder</code>, and many methods on <code>Iterable</code>, <code>Array</code>, <code>Map</code> and <code>Set</code>
  - 'New modules: <code>Regex</code> <code>Csv</code> <code>Toml</code> <code>DateTime</code> <code>Log</code> <code>Cli</code> <code>Net</code> <code>Zip</code> <code>Tar</code> <code>Gzip</code> <code>Digest</code> <code>Encoding</code> and more'
  - The C implementation (zevic0) moved to <a href="https://github.com/zevic-lang/zevic-c">zevic-lang/zevic-c</a>. The repository builds with clang alone
  - Examples of C++, Rust, Go and Python calling a Zevic library, and of Zevic calling Rust and C++
- version: 0.4.0
  date: 2026-11-08
  summary: セルフホスト。コンパイラが Zevic 自身で書かれました。
  changes:
  - <code>zevic1</code>（約 13,000 行の Zevic）が C 実装を完全に置き換えました。99 個のゴールデンテストがすべて通ります
  - 'ブートストラップ: zevic → zevic1 → zevic2 → zevic3 がバイト単位で同一の LLVM IR を出力します'
  - 共用体型 <code>A | B</code>、<code>x is T</code>、<code>match</code> の型パターン
  - 標準ライブラリが <code>Zevic</code> パッケージになりました
  release: false
  summary_en: 'Self-hosting: the compiler is written in Zevic.'
  changes_en:
  - <code>zevic1</code> (about 13,000 lines of Zevic) fully replaces the C implementation. All 99 golden tests pass
  - 'Bootstrap: zevic, then zevic1, zevic2 and zevic3 all write byte-identical LLVM IR'
  - Union types <code>A | B</code>, <code>x is T</code>, type patterns in <code>match</code>
  - The standard library became the <code>Zevic</code> package
- version: 0.3.1
  date: 2026-11-04
  summary: zevfmt、ループラベル、async、HTTP、Random、Json。
  changes:
  - '<code>zevfmt</code>: コードの整形（<code>-w</code> で書き換え、<code>-check</code> で検査）。<code>zevpm</code> も Zevic で書き直されました'
  - ループラベル <code>outer@ for (...) { break@outer }</code>
  - <code>async { ... }</code> と <code>await</code>、<code>Zevic.Async</code>（<code>Task</code> <code>Spawn</code> <code>Channel</code> <code>Mutex</code>）
  - <code>Zevic.Http</code>（<code>Get</code> <code>Post</code> <code>Send</code> <code>Listen</code>。TLS なし）
  - <code>Zevic.Random</code>（SplitMix64）と <code>Zevic.Json</code>（RFC 8259、行・列つきのエラー）
  - 初期の CI で見つかった macOS / Windows の不具合を多数修正
  release: false
  summary_en: zevfmt, loop labels, async, HTTP, Random and Json.
  changes_en:
  - '<code>zevfmt</code>: a code formatter (<code>-w</code> rewrites, <code>-check</code> verifies). <code>zevpm</code> was rewritten in Zevic'
  - 'Loop labels: <code>outer@ for (...) { break@outer }</code>'
  - <code>async { ... }</code> and <code>await</code>, with <code>Zevic.Async</code> (<code>Task</code> <code>Spawn</code> <code>Channel</code> <code>Mutex</code>)
  - <code>Zevic.Http</code> (<code>Get</code> <code>Post</code> <code>Send</code> <code>Listen</code>; no TLS)
  - <code>Zevic.Random</code> (SplitMix64) and <code>Zevic.Json</code> (RFC 8259, errors with line and column)
  - Many macOS and Windows fixes found by the first CI runs
- version: 0.3.0
  date: 2026-11-02
  summary: パッケージマネージャ zevpm とテスト、標準ライブラリの第 2 層。
  changes:
  - '<code>zevpm</code>: <code>new</code> <code>build</code> <code>run</code> <code>test</code> <code>get</code> <code>update</code> など。依存は git か path で、<code>zevic.lock</code> に固定します'
  - <code>test &quot;名前&quot; { }</code> ブロックと <code>Zevic.Test</code>
  - <code>zevic --lib</code> で静的ライブラリと C ヘッダーを作る
  - '標準ライブラリ: <code>Math</code> <code>Env</code> <code>Text</code> <code>Time</code> <code>Fs</code> <code>Process</code>、標準入力'
  release: false
  summary_en: The package manager zevpm and tests; the second tier of the standard library.
  changes_en:
  - '<code>zevpm</code>: <code>new</code> <code>build</code> <code>run</code> <code>test</code> <code>get</code> <code>update</code> and more. Dependencies come from git or a path and are pinned in <code>zevic.lock</code>'
  - <code>test &quot;name&quot; { }</code> blocks and <code>Zevic.Test</code>
  - <code>zevic --lib</code> builds a static library and a C header
  - 'Standard library: <code>Math</code> <code>Env</code> <code>Text</code> <code>Time</code> <code>Fs</code> <code>Process</code>, and standard input'
- version: 0.2.0
  date: 2026-11-01
  summary: クロージャ、defer、GC。
  changes:
  - 'ラムダとクロージャ <code>(x: I32) =&gt; x + n</code>、関数を値として扱う'
  - <code>defer</code> と <code>params</code>（可変長引数）
  - Boehm GC を同梱。ランタイムは初回だけコンパイルしてキャッシュします
  - '<code>Handle&lt;T&gt;</code>: C に Zevic のオブジェクトを数値で持たせる'
  release: false
  summary_en: Closures, defer and the GC.
  changes_en:
  - 'Lambdas and closures <code>(x: I32) =&gt; x + n</code>; functions as values'
  - <code>defer</code> and <code>params</code> (variadic parameters)
  - The Boehm GC is bundled. The runtime is compiled once and cached
  - '<code>Handle&lt;T&gt;</code>: lets C hold a number for a Zevic object'
- version: 0.1.0
  date: 2026-11-01
  summary: C との連携と interface。
  changes:
  - <code>extern &quot;C&quot;</code> と <code>export &quot;C&quot;</code>、C の型（<code>CInt</code> <code>CString</code> ほか）、<code>--emit-header</code>
  - C / C++ のファイル（<code>.c</code> <code>.cpp</code> <code>.o</code> <code>.a</code>）と一緒にビルド
  - <code>interface</code>（デフォルトメソッド、継承、動的呼び出し）とジェネリクスの制約
  - <code>Map&lt;K, V&gt;</code>（挿入順）と <code>Set&lt;T&gt;</code>
  release: false
  summary_en: C interop and interfaces.
  changes_en:
  - <code>extern &quot;C&quot;</code> and <code>export &quot;C&quot;</code>, C types (<code>CInt</code> <code>CString</code> and more), <code>--emit-header</code>
  - Build together with C / C++ files (<code>.c</code> <code>.cpp</code> <code>.o</code> <code>.a</code>)
  - <code>interface</code> (default methods, extension, dynamic calls) and generic constraints
  - <code>Map&lt;K, V&gt;</code> (insertion ordered) and <code>Set&lt;T&gt;</code>
- version: 0.0.3
  date: 2026-10-31
  summary: 'データ型: struct / class / enum、Option / Result。'
  changes:
  - <code>struct</code> <code>class</code> <code>enum</code>、<code>match</code>（ガード・範囲・入れ子・網羅性の検査）
  - <code>Option</code> と <code>Result</code>、<code>?</code> 演算子、<code>Error</code>
  - <code>Array&lt;T&gt;</code> を Zevic 自身で実装。ジェネリクス（単相化）とタプル
  release: false
  summary_en: 'Data: struct / class / enum, Option / Result.'
  changes_en:
  - <code>struct</code> <code>class</code> <code>enum</code>, and <code>match</code> with guards, ranges, nested patterns and an exhaustiveness check
  - <code>Option</code> and <code>Result</code>, the <code>?</code> operator, <code>Error</code>
  - <code>Array&lt;T&gt;</code> written in Zevic itself; generics (monomorphisation) and tuples
- version: 0.0.2
  date: ''
